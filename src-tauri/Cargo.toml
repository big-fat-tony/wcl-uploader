[package]
name = "logs-uploader"
version = "0.1.0"
description = "A lightweight Warcraft Logs uploader"
edition = "2021"
rust-version = "1.80"

[lib]
name = "logs_uploader_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "cookies", "rustls-tls"] }
tokio = { version = "1", features = ["sync", "time", "fs", "macros"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
thiserror = "2"
regex = "1"
rfd = "0.15"
chrono = "0.4"
log = "0.4"
env_logger = "0.11"
open = "5"
url = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
